# Self-signed certificate for the shared hostname. In a real environment this would
# come from an internal CA or cert-manager; here the candidate generates one with
# openssl and loads it as a kubernetes.io/tls Secret that the Ingress references.
apiVersion: v1
kind: Secret
metadata:
  name: shared-api-tls
  namespace: edge
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
